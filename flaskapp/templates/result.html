<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card shadow-lg p-4">
        <h2 class="text-center">Результаты обработки</h2>

        <div class="text-center">
            <h3>Исходное изображение</h3>
            <img src="{{ original }}" class="img-fluid rounded shadow-lg" width="400">
            <h4 class="mt-3">Гистограмма</h4>
            <img src="{{ histograms['original'] }}" class="img-fluid rounded shadow-sm" width="400">
        </div>

        <h3 class="mt-4">Разбитые части</h3>
        <div class="row text-center">
            <div class="col-md-3">
                <h5>Верхний левый</h5>
                <img src="{{ parts['top_left'] }}" class="img-fluid rounded shadow-sm">
                <h6 class="mt-2">Гистограмма</h6>
                <img src="{{ histograms['top_left'] }}" class="img-fluid rounded shadow-sm">
            </div>
            <div class="col-md-3">
                <h5>Верхний правый</h5>
                <img src="{{ parts['top_right'] }}" class="img-fluid rounded shadow-sm">
                <h6 class="mt-2">Гистограмма</h6>
                <img src="{{ histograms['top_right'] }}" class="img-fluid rounded shadow-sm">
            </div>
            <div class="col-md-3">
                <h5>Нижний левый</h5>
                <img src="{{ parts['bottom_left'] }}" class="img-fluid rounded shadow-sm">
                <h6 class="mt-2">Гистограмма</h6>
                <img src="{{ histograms['bottom_left'] }}" class="img-fluid rounded shadow-sm">
            </div>
            <div class="col-md-3">
                <h5>Нижний правый</h5>
                <img src="{{ parts['bottom_right'] }}" class="img-fluid rounded shadow-sm">
                <h6 class="mt-2">Гистограмма</h6>
                <img src="{{ histograms['bottom_right'] }}" class="img-fluid rounded shadow-sm">
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-success">Загрузить другое изображение</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
